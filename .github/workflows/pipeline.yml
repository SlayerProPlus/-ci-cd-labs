name: Primer Pipeline CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  hello-ci:
    name: Hello CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mostrar mensaje de bienvenida
        run: |
          echo "================================"
          echo "      PRIMER PIPELINE CI"
          echo "================================"
          echo "Repositorio: ${{ github.repository }}"
          echo "Rama       : ${{ github.ref_name }}"
          echo "Commit     : ${{ github.sha }}"
          echo "Evento     : ${{ github.event_name }}"
          echo "================================"

      - name: Mostrar fecha y hora de ejecución
        run: date

      - name: Mostrar versión de Git instalada
        run: git --version

  pruebas:
    name: Pruebas Unitarias
    runs-on: ubuntu-latest
    needs: hello-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas unitarias
        run: pytest tests/ -v --html=reporte-pruebas.html --self-contained-html

      - name: Publicar reporte de pruebas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-pruebas
          path: reporte-pruebas.html