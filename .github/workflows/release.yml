name: Crear Release

on:
  push:
    tags:
      - 'v*' # Se ejecuta solo cuando creas un Tag que empiece con "v" (ej. v1.0.0)

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Empaquetar Aplicación (ZIP)
        run: zip -r release-python.zip app/ requirements.txt

      - name: Publicar en GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: release-python.zip